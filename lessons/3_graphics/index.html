<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="shortcut icon" href="./resources/emoji-picture-blue.png">
    <style>
        .bg-green {
            background-color: aquamarine;
        }
        .color-red {
            color: crimson;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: blanchedalmond;
        }
        /* .img-container {
            text-align: center;
        } */
        img {
            display: block;
            width: 40%;
            margin: 5px auto;
            /* padding: 5px; */
            /* border: black 2px; */
            border-style:solid;
            border-color: black;
            border-width: 2px;
            border-radius: 15px;
            box-shadow: -5px -2px 0px black;
        }
        .circle {
            width: 200px;
            height: 100px;
            border-radius: 100%;
            /* background-color: brown; */
            border: solid black 2px;
            background-repeat: no-repeat;
            background-size: contain;
            background-position: center center;
            background-image: url('./resources/emoji-picture-blue.png');
        }

        .gradient {
            width: auto;
            height: 200px;
            /* background: linear-gradient(blue, pink); */
            /* background: linear-gradient(to right, blue, pink); */
            /* background: linear-gradient(to left, blue, pink); */
            /* background: linear-gradient(45deg, blue, #ff6734, pink); */
            background: linear-gradient(
                            45deg, 
                            rgba(0, 0, 255, 0.631),
                            #ff67346e, 
                            rgba(255, 192, 203, 0.511)),
                        radial-gradient(
                            circle at top left, 
                            red 30%, 
                            green);
            /* background: conic-gradient(red, yellow, blue, red); */
        }
        iframe {
            width: 100%;
            height: auto;
            border: solid 2px black;
        }
    </style>
</head>

<body>
    <h1>Графіка в веб дизайні</h1>

    <div class="img-container">
        <img src="./resources/emoji-picture-blue.png" alt="emoji-picture-blue">
        <img 
        src="https://e7.pngegg.com/pngimages/41/851/png-clipart-emoji-smiley-emoticon-emoji-love-heart.png" 
        alt="emoji-hearts">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing.</p>
    </div>

    <div class="circle"></div>

    <div class="gradient"></div>

    <p class="bg-green color-red">Lorem ipsum dolor sit.</p>

    <iframe src="second-page.html" frameborder="0"></iframe>

    <iframe width="1349" height="759" 
    src="https://www.youtube.com/embed/Hw06qvMvoqI?list=RDHw06qvMvoqI" 
    title="music for people who want to get sh*t done" 
    frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
</body>

</html>
